name: manifold

services:

  api:
    build:
      context: ./app
      dockerfile: Dockerfile
      network: host
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped
    env_file:
      - path: ./app/.env
        required: true
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./app/models:/srv/app/models   
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s   

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:8000
      DB_PATH: /srv/frontend/data/app.db
    ports:
      - "8501:8501"
    volumes:
      - ./frontend/data:/srv/frontend/data      
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s